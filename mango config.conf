# ~/.config/mango/config.conf
# Fully cleaned for mangoWM (based on official wiki)
# - Borders & rounding completely off
# - Named scratchpad for ncspot on SUPER+P
# - Overview on SUPER+S
# - Layout fixed (dwindle does NOT exist)

exec-once = ~/.config/mango/autostart.sh

################
### MONITORS ###
################
monitorrule = name:DP-3,mode:1920x1080@179.96,position:0x0,scale:1,enabled:1


#############################
### ENVIRONMENT VARIABLES ###
#############################
env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Oxygen_Black
env = HYPRCURSOR_SIZE,24
env = HYPRCURSOR_THEME,Oxygen_Black
env = XDG_MENU_PREFIX,arch-
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = __GL_GSYNC_ALLOWED,1
env = __GL_VRR_ALLOWED,1
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

#####################
### LOOK AND FEEL ###
#####################
# Layout / gaps / borders
gaps_in = 5
gaps_out = 20
borderpx = 0
focuscolor = 0x444444aa
bordercolor = 0x00000000
layout = tile                    # valid options: tile, scroller, monocle, grid, etc.

# Rounding
border_radius = 0

# Effects (all supported options kept)
shadows = 1
shadow_only_floating = 0
shadows_size = 7
shadows_blur = 15
blur = 1
blur_layer = 0
blur_optimized = 1
blur_params_num_passes = 2
blur_params_radius = 3
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.0

# Opacity (official names)
focused_opacity = 1.0
unfocused_opacity = 1.0

#################
### INPUT ###
#################
kb_layout = us
follow_mouse = 1
sensitivity = 0

touchpad {
    natural_scroll = false
}

###################
### KEYBINDINGS ###
###################
# Programs
bind=SUPER,Q,spawn,alacritty
bind=SUPER,C,killclient,
bind=SUPER,M,quit,                    # was "exit" (wrong)
bind=SUPER,E,spawn,dolphin
bind=SUPER,V,togglefloating,
bind=SUPER,R,spawn,wofi --show drun
bind=SUPER,N,spawn,obsidian

bind=SUPER,Tab,switch_layout,

# Scratchpad (ncspot)
bind=SUPER,P,toggle_named_scratchpad,none,ncspot,alacritty --title ncspot -e ncspot

# Fullscreen + Overview
bind=SUPER,F,togglefullscreen,        # was "fullscreen" (wrong)
bind=SUPER,S,toggleoverview,

# Directional focus (official command)
bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,K,focusdir,up
bind=SUPER,J,focusdir,down
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Workspaces / Tags (correct view vs tag)
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER,0,view,10

bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9
bind=SUPER+SHIFT,0,tag,10

# Screenshots
bind=NONE,PRINT,spawn,hyprshot -m region
bind=SHIFT,PRINT,spawn,hyprshot -m window

# Mouse binds
bindm=SUPER,mouse:272,movewindow
bindm=SUPER,mouse:273,resizewindow

# Useful extra: hot-reload config
bind=SUPER+CTRL,R,reload_config,

# Multimedia keys (unchanged)
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

##############################
### WINDOW RULES ###
##############################
# ncspot → named scratchpad (floating, centered, sized)
windowrule = isnamedscratchpad:1,isfloating:1,width:933,height:725,offsetx:0,offsety:0,title:^(ncspot)$
